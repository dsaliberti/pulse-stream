name: Testing

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test packages and build apps
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test BluetoothHealth
        run: swift test --package-path Packages/BluetoothHealth

      - name: Test PulseStreamFeature
        run: swift test --package-path Packages/PulseStreamFeature

      - name: Build PulseStream Broadcaster
        run: |
          xcodebuild \
            -workspace PulseStream.xcworkspace \
            -scheme PulseStreamBroadcaster \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/PulseStreamBroadcaster" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Build PulseStream
        run: |
          xcodebuild \
            -workspace PulseStream.xcworkspace \
            -scheme PulseStream \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PulseStream" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
